<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>WishList Лёша</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: одна колонка карточек. Фон-канвас эволюционирует от спокойного к «божественному» по мере прокрутки. Каждая карточка с тематическим рисунком, сияние при нажатии растёт от первого пункта к последнему. */
:root {
  --bg: #EDEFF7;
  --surface: #FFFFFF;
  --ink: #16193A;
  --muted: #5B6085;
  --line: #D8DBEC;
  --accent: #3F4BE0;
  --accent-ink: #FFFFFF;
  --candle: #F2B31E;
  --tint-s: 80%;
  --tint-l: 91%;
  --art-s: 55%;
  --art-l: 62%;
  --shadow: 22, 25, 58;
  --t: 0;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1126;
    --surface: #1A1D3D;
    --ink: #EEF0FF;
    --muted: #9CA2CF;
    --line: #2B2F5E;
    --accent: #8F99FF;
    --accent-ink: #0F1126;
    --tint-s: 40%;
    --tint-l: 24%;
    --art-s: 60%;
    --art-l: 60%;
    --shadow: 0, 0, 0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1126;
  --surface: #1A1D3D;
  --ink: #EEF0FF;
  --muted: #9CA2CF;
  --line: #2B2F5E;
  --accent: #8F99FF;
  --accent-ink: #0F1126;
  --tint-s: 40%;
  --tint-l: 24%;
  --art-s: 60%;
  --art-l: 60%;
  --shadow: 0, 0, 0;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 20px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

#bg, #fx {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  height: 100lvh;
  display: block;
  pointer-events: none;
  transform: translateZ(0);
  backface-visibility: hidden;
}
#bg { z-index: 0; }
#fx { z-index: 30; }

.wrap { position: relative; z-index: 1; max-width: 520px; margin-inline: auto; }

header { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 4px; }
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.flame {
  width: 8px; height: 12px;
  background: var(--candle);
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  flex: none;
}
h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(26px, 8vw, 38px);
  line-height: 1.1;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: balance;
  overflow-wrap: anywhere;
}

ul.list {
  list-style: none;
  margin: 0;
  padding: 0;
  padding-top: max(0px, calc(50vh - 224px));
  padding-bottom: max(24px, calc(50vh - 120px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.item {
  --f: 0;
  position: relative;
  overflow: hidden;
  background: linear-gradient(115deg, var(--surface) 28%, hsl(var(--h) var(--tint-s) var(--tint-l)) 135%);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 12px;
  transform-origin: center;
  will-change: transform, opacity;
  box-shadow:
    0 calc(12px * var(--f)) calc(32px * var(--f)) rgba(var(--shadow), calc(0.22 * var(--f))),
    0 0 calc(46px * var(--f) * var(--t)) rgba(255, 205, 110, calc(0.55 * var(--f) * var(--t)));
}

.art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  --c: hsl(var(--h) var(--art-s) var(--art-l));
  stroke: var(--c);
  fill: none;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.8;
  -webkit-mask-image: linear-gradient(to left, #000 20%, rgba(0, 0, 0, 0.22) 100%);
  mask-image: linear-gradient(to left, #000 20%, rgba(0, 0, 0, 0.22) 100%);
}
.art .f { fill: var(--c); fill-opacity: 0.5; stroke: none; }

.row {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
  flex: none;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.title { min-width: 0; }
.title b { display: block; font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.title span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

.actions { display: flex; flex-direction: column; gap: 6px; }
.btn {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  line-height: 1;
  height: 34px;
  min-width: 104px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.08s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(0.94); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.ghost[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }

.more {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.25s ease;
}
.more.open { grid-template-rows: 1fr; }
.more > div { overflow: hidden; min-height: 0; }
.more p { margin: 0; padding: 12px 4px 4px; color: var(--muted); font-size: 14px; }

.item.zap .art { animation: artflash var(--sd, 300ms) ease-out; }
@keyframes artflash {
  0% { filter: brightness(2.6) saturate(1.8); opacity: 1; }
  100% { filter: none; }
}

footer { text-align: center; padding-bottom: 28px; }
footer .tip {
  max-width: 340px;
  margin: 0 auto 12px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  text-wrap: balance;
}
footer span {
  display: inline-block;
  font-size: 12px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
}

@media (max-width: 380px) {
  .row { grid-template-columns: auto minmax(0, 1fr); }
  .actions { grid-column: 1 / -1; flex-direction: row; }
  .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .more { transition: none; }
}
</style>

</head>

  function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

  /* ---------- тематические рисунки карточек ---------- */
  function art(kind, seed) {
    var o = '', i, j, x, y, d, pts;
    if (kind === 'wave') {
      for (i = 0; i < 5; i++) {
        y = 14 + i * 18;
        o += '<path d="M0 ' + y + ' C40 ' + (y - 16) + ' 80 ' + (y + 16) + ' 120 ' + y + ' S200 ' + (y - 16) + ' 240 ' + y + ' S320 ' + (y + 16) + ' 360 ' + y + '" style="stroke-opacity:' + (0.35 + i * 0.1).toFixed(2) + '"/>';
      }
    } else if (kind === 'dots') {
      for (i = 0; i < 6; i++) {
        for (j = 0; j < 18; j++) {
          o += '<circle class="f" cx="' + (10 + j * 20 + (i % 2) * 10) + '" cy="' + (10 + i * 16) + '" r="' + (0.8 + sr(i * 18 + j + seed) * 1.4).toFixed(2) + '"/>';
        }
      }
    } else if (kind === 'pins') {
      var c = [[40, 30, 16], [95, 72, 10], [160, 24, 8], [230, 64, 18], [300, 30, 12], [337, 78, 9]];
      for (i = 0; i < c.length; i++) {
        o += '<circle cx="' + c[i][0] + '" cy="' + c[i][1] + '" r="' + c[i][2] + '"/><circle class="f" cx="' + c[i][0] + '" cy="' + c[i][1] + '" r="' + (c[i][2] * 0.4).toFixed(1) + '"/>';
      }
    } else if (kind === 'stripes') {
      var b = [[196, 22], [232, 10], [256, 30], [300, 14], [326, 22]];
      for (i = 0; i < b.length; i++) {
        x = b[i][0];
        o += '<polygon class="f" points="' + x + ',100 ' + (x + 30) + ',0 ' + (x + 30 + b[i][1]) + ',0 ' + (x + b[i][1]) + ',100"/>';
      }
    } else if (kind === 'arcs') {
      var rs = [24, 48, 72, 96, 120, 144];
      for (i = 0; i < rs.length; i++) {
        o += '<circle cx="360" cy="50" r="' + rs[i] + '" style="stroke-opacity:' + (0.95 - rs[i] / 200).toFixed(2) + '"/>';
      }
    } else if (kind === 'ultra') {
      for (i = 0; i < 3; i++) {
        pts = '';
        for (x = 0; x <= 360; x += 3) {
          y = 50 + (i - 1) * 22 + Math.sin(x * 0.9 + i) * (6 + 10 * Math.sin(x / 57 + i));
          pts += x + ',' + y.toFixed(1) + ' ';
        }
        o += '<polyline points="' + pts + '" style="stroke-opacity:' + (0.5 + i * 0.15).toFixed(2) + '"/>';
      }
    } else if (kind === 'eq') {
      for (i = 0; i < 24; i++) {
        var h = 18 + sr(i + seed) * 58;
        o += '<rect class="f" x="' + (6 + i * 15) + '" y="' + (100 - h).toFixed(1) + '" width="8" height="' + h.toFixed(1) + '" rx="2"/>';
      }
    } else if (kind === 'layers') {
      for (i = 0; i < 8; i++) {
        y = 10 + i * 12;
        o += '<path d="M0 ' + y + ' H360" style="stroke-opacity:' + (0.3 + (i % 3) * 0.2).toFixed(2) + '"/>';
      }
      o += '<rect x="270" y="8" width="40" height="14" rx="3"/><path d="M290 22 v12"/>';
    } else if (kind === 'hex') {
      var R = 13, w = R * Math.sqrt(3);
      d = '';
      for (i = 0; i < 7; i++) {
        for (j = 0; j < 18; j++) {
          var cx = j * w + (i % 2) * w / 2, cy = i * R * 1.5;
          for (var k = 0; k < 6; k++) {
            var a = Math.PI / 6 + k * Math.PI / 3;
            d += (k === 0 ? 'M' : 'L') + (cx + R * Math.cos(a)).toFixed(1) + ' ' + (cy + R * Math.sin(a)).toFixed(1);
          }
          d += 'Z';
        }
      }
      o += '<path d="' + d + '" style="stroke-opacity:0.55"/>';
    }
    return o;
  }

  /* ---------- холсты ---------- */
  var bgc = document.getElementById('bg'), bx = bgc.getContext('2d');
  var fxc = document.getElementById('fx'), fxx = fxc.getContext('2d');
  var W = 0, H = 0, DPR = 1, dirty = true;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    var nw = bgc.clientWidth || window.innerWidth, nh = bgc.clientHeight || window.innerHeight;
    if (nw !== W || nh !== H || !bgc.width) {
      W = nw;
      H = nh;
      bgc.width = fxc.width = Math.round(W * DPR);
      bgc.height = fxc.height = Math.round(H * DPR);
      drawBg(performance.now());
    }
    dirty = true;
    scheduleCards();
  }

  var stars = [], parts = [], clouds = [], i0;
  for (i0 = 0; i0 < 140; i0++) stars.push({ x: Math.random(), y: Math.random() * 0.78, r: rnd(0.5, 1.7), ph: rnd(0, 6.28), sp: rnd(0.0008, 0.003) });
  for (i0 = 0; i0 < 70; i0++) parts.push({ x: Math.random(), y: Math.random(), v: rnd(0.02, 0.06), ph: rnd(0, 6.28), sz: rnd(0.8, 2.4) });
  for (i0 = 0; i0 < 7; i0++) clouds.push({ x: Math.random() * 1.2, y: rnd(0.22, 0.88), s: rnd(0.35, 0.6), v: rnd(0.008, 0.02) });

  var baseCol = [237, 239, 247], frameN = 0;
  function readBase() {
    var m = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g);
    if (m && m.length >= 3) baseCol = [+m[0], +m[1], +m[2]];
  }

  var target = 0, tCur = 0;

  function drawBg(now) {
    var time = reduce ? 0 : now, t = tCur, i, j;
    bx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bx.globalCompositeOperation = 'source-over';

    var k1 = sstep(0, 0.55, t), k2 = sstep(0.7, 1, t);
    var top = mix(baseCol, [8, 6, 30], k1);
    var bot = mix(mix(baseCol, [48, 26, 104], k1), [110, 58, 128], k2);
    var g = bx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top));
    g.addColorStop(1, rgb(bot));
    bx.fillStyle = g;
    bx.fillRect(0, 0, W, H);

    /* спокойные размытые пятна */
    var ba = 0.2 * (1 - sstep(0, 0.4, t));
    if (ba > 0.004) {
      for (j = 0; j < 3; j++) {
        var cx = W * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * 0.00012 * (1 + j) + j * 2)));
        var cy = H * (0.25 + 0.5 * (0.5 + 0.5 * Math.cos(time * 0.0001 * (1 + j) + j)));
        var r = Math.max(W, H) * 0.35;
        var bg2 = bx.createRadialGradient(cx, cy, 0, cx, cy, r);
        bg2.addColorStop(0, 'rgba(120,135,255,' + ba + ')');
        bg2.addColorStop(1, 'rgba(120,135,255,0)');
        bx.fillStyle = bg2;
        bx.fillRect(cx - r, cy - r, r * 2, r * 2);
      }
    }

    /* звёзды */
    var sa = sstep(0.12, 0.65, t);
    if (sa > 0.01) {
      for (i = 0; i < stars.length; i++) {
        if (i / stars.length > sa) break;
        var st = stars[i];
        var al = (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * st.sp + st.ph))) * Math.min(1, sa * 1.6);
        bx.fillStyle = 'rgba(255,250,235,' + al.toFixed(3) + ')';
        bx.beginPath();
        bx.arc(st.x * W, st.y * H, st.r, 0, 6.2832);
        bx.fill();
      }
    }

    /* облака */
    var ca = sstep(0.28, 0.8, t) * 0.3;
    if (ca > 0.004) {
      var cc = mix([150, 140, 205], [255, 214, 150], sstep(0.5, 1, t));
      var sz = Math.min(W, 600);
      for (i = 0; i < clouds.length; i++) {
        var cl = clouds[i], s = cl.s * sz;
        var ccx = ((cl.x * W + time * cl.v) % (W * 1.5)) - W * 0.25;
        for (j = 0; j < 4; j++) {
          var px = ccx + j * s * 0.55 - s, py = cl.y * H + Math.sin(j * 1.7 + i) * s * 0.12;
          var rg = bx.createRadialGradient(px, py, 0, px, py, s * 0.9);
          rg.addColorStop(0, rgb(cc, ca));
          rg.addColorStop(1, rgb(cc, 0));
          bx.fillStyle = rg;
          bx.fillRect(px - s, py - s, s * 2, s * 2);
        }
      }
    }

    /* золотой свет сверху, лучи, нимб, искры */
    bx.globalCompositeOperation = 'lighter';
    var ga = sstep(0.3, 1, t);
    if (ga > 0.01) {
      var gg = bx.createRadialGradient(W / 2, -H * 0.02, 0, W / 2, -H * 0.02, H * 1.15);
      gg.addColorStop(0, 'rgba(255,244,205,' + (ga * 0.95) + ')');
      gg.addColorStop(0.22, 'rgba(255,205,110,' + (ga * 0.55) + ')');
      gg.addColorStop(0.6, 'rgba(190,110,200,' + (ga * 0.18) + ')');
      gg.addColorStop(1, 'rgba(190,110,200,0)');
      bx.fillStyle = gg;
      bx.fillRect(0, 0, W, H);
    }

    var ra = sstep(0.42, 1, t) * 0.26;
    if (ra > 0.005) {
      var ox = W / 2, oy = -H * 0.06, L = H * 1.5, n = 18, rot = time * 0.00004;
      var rg2 = bx.createRadialGradient(ox, oy, 0, ox, oy, L);
      rg2.addColorStop(0, 'rgba(255,236,180,' + ra + ')');
      rg2.addColorStop(1, 'rgba(255,236,180,0)');
      bx.fillStyle = rg2;
      for (i = 0; i < n; i++) {
        var ang = rot + i * (6.2832 / n);
        var hw = 0.045 + 0.03 * Math.sin(i * 3.1 + time * 0.0004);
        bx.beginPath();
        bx.moveTo(ox, oy);
        bx.lineTo(ox + Math.cos(ang - hw) * L, oy + Math.sin(ang - hw) * L);
        bx.lineTo(ox + Math.cos(ang + hw) * L, oy + Math.sin(ang + hw) * L);
        bx.closePath();
        bx.fill();
      }
    }

    var ha = sstep(0.68, 1, t);
    if (ha > 0.01) {
      var hx = W / 2, hy = H * 0.1;
      var hg = bx.createRadialGradient(hx, hy, 0, hx, hy, W * 0.35);
      hg.addColorStop(0, 'rgba(255,250,225,' + (ha * 0.6) + ')');
      hg.addColorStop(1, 'rgba(255,250,225,0)');
      bx.fillStyle = hg;
      bx.fillRect(0, 0, W, H * 0.6);
      for (i = 0; i < 3; i++) {
        var rx = W * 0.18 * (1 + i * 0.5) * (1 + 0.03 * Math.sin(time * 0.001 + i));
        bx.strokeStyle = 'rgba(255,226,150,' + (ha * 0.5 / (i + 1)).toFixed(3) + ')';
        bx.lineWidth = 1.5;
        bx.beginPath();
        bx.ellipse(hx, hy, rx, rx * 0.28, 0, 0, 6.2832);
        bx.stroke();
      }
    }

    var pa = sstep(0.45, 1, t);
    if (pa > 0.01) {
      for (i = 0; i < parts.length; i++) {
        var p = parts[i];
        var py2 = (((p.y * H - time * p.v) % H) + H) % H;
        var px2 = p.x * W + Math.sin(time * 0.001 + p.ph) * 14;
        var pal = pa * (0.25 + 0.75 * Math.pow(Math.sin(time * 0.003 + p.ph), 2));
        bx.fillStyle = 'rgba(255,214,120,' + (pal * 0.25).toFixed(3) + ')';
        bx.beginPath();
        bx.arc(px2, py2, p.sz * 3.2, 0, 6.2832);
        bx.fill();
        bx.fillStyle = 'rgba(255,240,190,' + pal.toFixed(3) + ')';
        bx.beginPath();
        bx.arc(px2, py2, p.sz, 0, 6.2832);
        bx.fill();
      }
    }

    /* мягкие золотые пульсации света в самом конце */
    var la = sstep(0.82, 1, t);
    if (la > 0.01) {
      var pu = la * 0.14 * (0.5 + 0.5 * Math.sin(time * 0.0012));
      var pg = bx.createRadialGradient(W / 2, H * 0.1, 0, W / 2, H * 0.1, H * 0.9);
      pg.addColorStop(0, 'rgba(255,246,215,' + pu.toFixed(3) + ')');
      pg.addColorStop(1, 'rgba(255,214,140,0)');
      bx.fillStyle = pg;
      bx.fillRect(0, 0, W, H);
    }
    bx.globalCompositeOperation = 'source-over';
  }

  var last = 0, lastDrawnT = -1, lastCssT = -1;
  function bgLoop(now) {
    requestAnimationFrame(bgLoop);
    if (now - last < 32) return;
    last = now;
    if (reduce) tCur = target;
    else {
      tCur += (target - tCur) * 0.1;
      if (Math.abs(target - tCur) < 0.0005) tCur = target;
    }
    if (Math.abs(tCur - lastCssT) > 0.002) {
      lastCssT = tCur;
      document.documentElement.style.setProperty('--t', tCur.toFixed(3));
    }
    if ((frameN++ % 60) === 0) readBase();
    if (reduce && !dirty && tCur === lastDrawnT) return;
    dirty = false;
    lastDrawnT = tCur;
    drawBg(now);
  }

  /* ---------- сияние при нажатии ---------- */
  var effects = [], fxRaf = 0;
  function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
  function bump(p, c, w) { var d = (p - c) / w; return Math.exp(-d * d); }

  function fxTick(now) {
    fxRaf = 0;
    var c = fxx, maxd = Math.max(W, H), i, k;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    var alive = [];
    for (var e = 0; e < effects.length; e++) {
      var ef = effects[e], age = now - ef.start;
      if (age > ef.dur) continue;
      alive.push(ef);
      var p = age / ef.dur, L = ef.L, col = ef.col, ox = ef.ox, oy = ef.oy, inv = 1 - p;

      if (ef.wash > 0) {
        var env = p < 0.2 ? p / 0.2 : Math.pow((1 - p) / 0.8, 2);
        var wa = ef.wash * env * (1 + (L > 0.85 ? 0.8 * bump(p, 0.5, 0.1) : 0));
        var wg = c.createRadialGradient(ox, oy, 0, ox, oy, maxd * 1.2);
        wg.addColorStop(0, 'rgba(255,246,215,' + wa + ')');
        wg.addColorStop(0.5, 'rgba(255,214,140,' + (wa * 0.6) + ')');
        wg.addColorStop(1, 'rgba(255,200,120,' + (wa * 0.2) + ')');
        c.fillStyle = wg;
        c.fillRect(0, 0, W, H);
      }

      var R = ef.radius * (0.35 + 0.65 * easeOut(p));
      var ca = Math.pow(inv, 1.5) * lerp(0.55, 0.9, L);
      var cg = c.createRadialGradient(ox, oy, 0, ox, oy, R);
      cg.addColorStop(0, 'rgba(255,255,255,' + ca + ')');
      cg.addColorStop(0.35, rgb(col, ca * 0.6));
      cg.addColorStop(1, rgb(col, 0));
      c.fillStyle = cg;
      c.fillRect(ox - R, oy - R, R * 2, R * 2);

      for (k = 0; k < ef.rings; k++) {
        var pk = clamp(p * 1.15 - k * 0.16, 0, 1);
        if (pk <= 0 || pk >= 1) continue;
        c.strokeStyle = rgb(col, (1 - pk) * 0.7);
        c.lineWidth = lerp(1.5, 4, L) * (1 - pk) + 0.5;
        c.beginPath();
        c.arc(ox, oy, ef.radius * easeOut(pk), 0, 6.2832);
        c.stroke();
      }

      if (ef.rays > 0) {
        var len = ef.radius * 1.1 * easeOut(Math.min(1, p * 1.6));
        if (len > 1) {
          var ra = Math.pow(inv, 1.2) * 0.45 * lerp(0.5, 1, L);
          var rg = c.createRadialGradient(ox, oy, 0, ox, oy, len);
          rg.addColorStop(0, rgb(col, ra));
          rg.addColorStop(1, rgb(col, 0));
          c.fillStyle = rg;
          for (i = 0; i < ef.rays; i++) {
            var ang = i * (6.2832 / ef.rays) + p * 0.5, hw = 0.035 + 0.02 * (i % 3);
            c.beginPath();
            c.moveTo(ox, oy);
            c.lineTo(ox + Math.cos(ang - hw) * len, oy + Math.sin(ang - hw) * len);
            c.lineTo(ox + Math.cos(ang + hw) * len, oy + Math.sin(ang + hw) * len);
            c.closePath();
            c.fill();
          }
        }
      }

      for (i = 0; i < ef.sparks.length; i++) {
        var s = ef.sparks[i], q = clamp((p - s.d) / (1 - s.d), 0, 1);
        if (q <= 0 || q >= 1) continue;
        var dist = s.r * easeOut(q);
        var sx = ox + Math.cos(s.a) * dist, sy = oy + Math.sin(s.a) * dist - q * q * s.rise;
        var sa = 1 - q;
        c.fillStyle = rgb(col, sa * 0.28);
        c.beginPath();
        c.arc(sx, sy, s.z * 3.2, 0, 6.2832);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,' + (sa * 0.95).toFixed(3) + ')';
        c.beginPath();
        c.arc(sx, sy, s.z * (1 - q * 0.4), 0, 6.2832);
        c.fill();
      }
    }
    effects = alive;
    if (alive.length) fxRaf = requestAnimationFrame(fxTick);
    else {
      c.clearRect(0, 0, W, H);
      fxc.hidden = true;
    }
  }

  function zap(el, L) {
    var r = el.getBoundingClientRect();
    var radius = lerp(70, Math.max(W, H) * 0.75, Math.pow(L, 1.2));
    var e = {
      start: performance.now(),
      ox: r.left + r.width / 2,
      oy: r.top + r.height / 2,
      L: L,
      dur: reduce ? 500 : lerp(550, 1700, L),
      radius: radius,
      rings: reduce ? 1 : 1 + Math.round(L * 2),
      rays: (reduce || L < 0.25) ? 0 : 8 + Math.round(L * 12),
      wash: (reduce || L < 0.4) ? 0 : (L - 0.4) / 0.6 * 0.38,
      col: mix([140, 155, 255], [255, 214, 120], Math.pow(L, 0.8)),
      sparks: []
    };
    var n = reduce ? 0 : Math.round(lerp(4, 70, L));
    for (var i = 0; i < n; i++) {
      e.sparks.push({ a: rnd(0, 6.2832), r: radius * rnd(0.3, 0.95), d: rnd(0, 0.25), z: rnd(1, 2.6) * (1 + L * 0.6), rise: rnd(0, 40) * L });
    }
    effects.push(e);
    fxc.hidden = false;
    if (!fxRaf) fxRaf = requestAnimationFrame(fxTick);
  }

  function flashCard(li, row, L) {
    li.style.setProperty('--sd', Math.round(400 + L * 800) + 'ms');
    li.classList.remove('zap');
    void li.offsetWidth;
    li.classList.add('zap');
  }

  /* ---------- список ---------- */
  var list = document.getElementById('list');
  var N = ITEMS.length;

  ITEMS.forEach(function (it, i) {
    var L = N > 1 ? i / (N - 1) : 0;
    var li = document.createElement('li');
    li.className = 'item';
    li.style.setProperty('--h', it.hue);
    li.innerHTML =
      '<svg class="art" viewBox="0 0 360 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + art(it.kind, i * 7) + '</svg>' +
      '<div class="row">' +
        '<div class="avatar"><img src="' + it.img + '" alt=""></div>' +
        '<div class="title"><b>' + it.title + '</b><span>' + it.price + '</span></div>' +
        '<div class="actions">' +
          '<a class="btn primary" href="' + it.url + '" target="_blank" rel="noopener">В магазин</a>' +
          '<button class="btn ghost" type="button" id="d' + i + '" aria-expanded="false" aria-controls="m' + i + '">Описание</button>' +
        '</div>' +
      '</div>' +
      '<div class="more" id="m' + i + '"><div><p>' + it.desc + '</p></div></div>';
    list.appendChild(li);

    var row = li.querySelector('.row');
    var shop = li.querySelector('.primary');
    var btn = li.querySelector('.ghost');
    var more = li.querySelector('.more');

    shop.addEventListener('click', function () { zap(shop, L); flashCard(li, row, L); });
    btn.addEventListener('click', function () {
      zap(btn, L);
      flashCard(li, row, L);
      var open = more.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      setTimeout(updateCards, 280);
    });
  });

  /* ---------- прокрутка: увеличение центрального пункта и прогресс фона ---------- */
  var els = Array.prototype.slice.call(list.children);
  var ticking = false;

  function updateCards() {
    ticking = false;
    var vh = window.innerHeight, c = vh / 2;
    for (var i = 0; i < els.length; i++) {
      var r = els[i].getBoundingClientRect();
      var mid = r.top + r.height / 2;
      var d = Math.min(1, Math.abs(mid - c) / (vh * 0.42));
      var f = 1 - d;
      f = f * f * (3 - 2 * f);
      els[i].style.transform = 'scale(' + (0.9 + 0.14 * f).toFixed(3) + ')';
      els[i].style.opacity = (0.5 + 0.5 * f).toFixed(3);
      els[i].style.setProperty('--f', f.toFixed(3));
    }
    var maxS = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    target = clamp((window.pageYOffset || document.documentElement.scrollTop || 0) / maxS, 0, 1);
  }
  function scheduleCards() {
    if (!ticking) { ticking = true; requestAnimationFrame(updateCards); }
  }

  window.addEventListener('scroll', scheduleCards, { passive: true });
  window.addEventListener('resize', resize);
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { readBase(); dirty = true; });
    new MutationObserver(function () { readBase(); dirty = true; }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (err) {}

  readBase();
  updateCards();
  tCur = target;
  resize();
  requestAnimationFrame(bgLoop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateCards);
})();
</script>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  if (tg.initData) {
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest && ev.target.closest('a[target="_blank"]');
      if (a) { ev.preventDefault(); try { tg.openLink(a.href); } catch (e) { window.open(a.href, '_blank'); } }
    });
  }
})();
</script>
