<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лапки — здоровье питомца</title>
<meta name="description" content="Паспорт здоровья питомца: прививки, течка, лекарства, корма, анализы и аллергии. Сфотографируйте документ — приложение само всё разнесёт.">
<meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13110E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лапки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="view" id="view"><div class="empty"><div class="spin" style="margin:40px auto"></div></div></main>
  <nav class="tabbar" id="tabbar" aria-label="Навигация"></nav>
</div>
<div id="sheets"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-gallery" accept="image/*" hidden>
<input type="file" id="file-photo" accept="image/*" hidden>
<input type="file" id="file-import" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
